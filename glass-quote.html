<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ユーエス硝子 ガラス積算ツール</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo','Yu Gothic',sans-serif;background:#eef1f5;color:#222;font-size:15px}
.app{max-width:1500px;margin:0 auto;padding:12px}

/* タッチ改善 */
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
input,select,textarea{-webkit-tap-highlight-color:transparent}

/* Header */
.hdr{background:linear-gradient(135deg,#0d2b50,#1a5f8c);color:#fff;padding:18px 24px;border-radius:14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.hdr h1{font-size:20px;font-weight:800}
.hdr p{font-size:12px;opacity:.75;margin-top:4px}

/* Top bar */
.topbar{display:flex;gap:10px;align-items:center;background:#fff;border-radius:10px;padding:12px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);flex-wrap:wrap}
.tblabel{font-weight:700;font-size:13px;white-space:nowrap}
#pname{flex:1;min-width:180px;padding:10px 14px;border:1.5px solid #ccc;border-radius:7px;font-family:inherit;font-size:16px;min-height:44px;-webkit-appearance:none;appearance:none}
#pname:focus{outline:none;border-color:#1a5f8c}
.toggle-wrap{display:flex;border:2px solid #1a5f8c;border-radius:8px;overflow:hidden}
.tbtn{padding:10px 20px;border:none;font-size:14px;font-weight:700;font-family:inherit;background:#fff;color:#1a5f8c;min-height:44px}
.tbtn:first-child{border-right:1px solid #1a5f8c}
.tbtn.on{background:#1a5f8c;color:#fff}

/* Settings panel */
.settings-panel{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:14px;border-left:5px solid #0d2b50;overflow:hidden}
.settings-hdr{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;font-weight:800;font-size:14px;color:#0d2b50;background:none;border:none;font-family:inherit;text-align:left;min-height:48px}
.settings-hdr-arrow{font-size:13px;transition:transform .25s;display:inline-block;transform:rotate(180deg)}
.settings-hdr-arrow.open{transform:rotate(0deg)}
.settings-inner{padding:16px 18px 18px;border-top:1px solid #eee;display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.settings-inner{grid-template-columns:1fr}}
.sblock{background:#f8fafc;border-radius:8px;padding:14px;border:1px solid #e5ecf4}
.sblock-title{font-weight:800;font-size:12px;color:#0d2b50;margin-bottom:10px;letter-spacing:.05em;text-transform:uppercase}
.srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.srow:last-child{margin-bottom:0}
.srow>label{font-size:13px;color:#444;display:flex;align-items:center;gap:6px;min-height:36px}
.srow input[type=number],.srow input[type=text]{padding:8px 12px;border:1.5px solid #ddd;border-radius:6px;font-size:16px;font-family:inherit;width:110px;min-height:44px;-webkit-appearance:none;appearance:none}
.srow input[type=number]:focus,.srow input[type=text]:focus{outline:none;border-color:#1a5f8c}
.srow input.wide{width:200px}
.srow input[type=radio]{accent-color:#1a5f8c;width:20px;height:20px;flex-shrink:0}
.srow input[type=checkbox]{accent-color:#1a5f8c;width:20px;height:20px;flex-shrink:0}
.mult-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:4px}
@media(max-width:600px){.mult-grid{grid-template-columns:repeat(3,1fr)}}
.mult-item{display:flex;flex-direction:column;gap:4px;align-items:center}
.mult-item label{font-size:11px;color:#555;text-align:center}
.mult-item input{width:72px;text-align:center;padding:8px 4px;border:1.5px solid #ddd;border-radius:6px;font-size:15px;font-family:inherit;min-height:44px;-webkit-appearance:none;appearance:none}

/* Row cards */
.row-cards{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.row-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.07);border-left:5px solid #1a5f8c}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-ttl{font-weight:800;font-size:15px;color:#0d2b50}
.btn-del{background:#e53935;color:#fff;border:none;padding:10px 20px;border-radius:7px;font-size:13px;font-weight:700;font-family:inherit;min-height:44px}
.card-sections{display:flex;flex-direction:column;gap:12px}
.csec-title{font-size:11px;font-weight:700;color:#1a5f8c;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #e0ecf7}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.fields-wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fglabel{font-size:11px;font-weight:700;color:#555;letter-spacing:.04em}
.fg input[type=number],.fg input[type=text]{padding:10px 12px;border:1.5px solid #ddd;border-radius:7px;font-size:16px;font-family:inherit;width:100%;min-height:44px;-webkit-appearance:none;appearance:none}
.fg input[type=number]:focus,.fg input[type=text]:focus{outline:none;border-color:#1a5f8c}
.fg select{padding:10px 12px;border:1.5px solid #ddd;border-radius:7px;font-size:16px;font-family:inherit;width:100%;min-height:44px;background:#fff}
.fg select:focus{outline:none;border-color:#1a5f8c}
.rrow{display:flex;gap:4px;flex-wrap:wrap;padding-top:3px}
.rrow label{display:flex;align-items:center;gap:7px;font-size:14px;color:#333;min-height:44px;padding:4px 10px;border-radius:6px}
.rrow label:active{background:#eef5ff}
.rrow input[type=radio]{width:20px;height:20px;accent-color:#1a5f8c;flex-shrink:0}
.rrow input[type=checkbox]{width:20px;height:20px;accent-color:#1a5f8c;flex-shrink:0}
.custom-fields{background:#f0f7ff;border-radius:8px;padding:12px;border:1px dashed #1a5f8c;margin-top:4px}
.caulk-fields{background:#fff9f0;border-radius:8px;padding:12px;border:1px dashed #c08000;margin-top:8px}
.add-fields{background:#f9f9f9;border-radius:8px;padding:12px;border:1px solid #e0e0e0;margin-top:4px}

/* Add button */
.btn-add{display:block;width:100%;padding:16px;background:#e8f0f9;border:2px dashed #1a5f8c;border-radius:10px;color:#1a5f8c;font-size:16px;font-weight:700;font-family:inherit;text-align:center;margin-bottom:20px;min-height:56px}
.btn-add:active{background:#d0e5f7}

/* Table section */
.tbl-section{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);padding:20px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl-title{font-size:15px;font-weight:800;color:#0d2b50;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:900px}
thead th{background:#0d2b50;color:#fff;padding:8px 6px;text-align:center;white-space:nowrap;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
tbody td{padding:7px 6px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}
tbody td.c{text-align:center}
tbody td.l{text-align:left}
tbody tr:nth-child(even){background:#f7f9fc}
tfoot td{padding:8px 6px;text-align:right;font-weight:700;white-space:nowrap}
tfoot td.l{text-align:left}
.tr-sub td{background:#ecf3fb;border-top:2px solid #1a5f8c}
.tr-misc td{background:#fff8e1}
.tr-disc td{background:#fef3f3}
.tr-grand td{background:#0d2b50;color:#fff;font-size:13px;border-top:2px solid #1a5f8c;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tr-net td{background:#e8f5e9}
.tr-quote td{background:#e3f2fd}

/* お見積書金額（元請け用・大表示） */
.customer-quote-big{margin-top:22px;text-align:center;font-weight:900;page-break-inside:avoid;padding:18px 20px;border-top:3px solid #0d2b50;border-radius:0 0 8px 8px}
.cqb-label{font-size:18px;color:#0d2b50;margin-bottom:8px;font-weight:700}
.cqb-amount{font-size:38px;color:#0d2b50;font-weight:900;letter-spacing:.02em}
.cqb-sub{font-size:13px;color:#555;margin-top:6px}

/* モバイル：テーブル→カード表示 */
@media screen and (max-width:900px){
  .tbl-section{padding:12px 10px}
  table{display:block;min-width:0}
  thead{display:none}
  tbody{display:block}
  tfoot{display:none}
  tbody tr{display:block;border:1px solid #d4dce8;border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff}
  tbody tr:nth-child(even){background:#f7f9fc}
  tbody td{display:flex;justify-content:space-between;align-items:baseline;border:none;border-bottom:1px solid #f0f0f0;padding:5px 2px;white-space:normal;text-align:right}
  tbody td:last-child{border-bottom:none}
  tbody td::before{content:attr(data-label);font-weight:700;color:#0d2b50;font-size:11px;flex:0 0 auto;margin-right:10px;text-align:left;white-space:nowrap}
  tbody td.td-detail{display:none}
  tbody td.td-total{background:#ecf3fb;border-radius:0 0 8px 8px;margin:4px -12px -10px;padding:8px 14px;font-size:14px;font-weight:800;border-top:2px solid #1a5f8c}
  .mobile-totals{display:block;margin-top:12px}
  .mt-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:7px;margin-bottom:5px;font-size:13px;font-weight:600}
}
.mobile-totals{display:none}

/* Banners */
.banner-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.total-banner{flex:1;min-width:200px;background:linear-gradient(135deg,#0d2b50,#1a5f8c);color:#fff;border-radius:12px;padding:16px 20px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.total-banner .lbl{font-size:12px;opacity:.85;margin-bottom:4px}
.total-banner .amt{font-size:32px;font-weight:900}
.profit-banner{flex:1;min-width:200px;background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#fff;border-radius:12px;padding:16px 20px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.profit-banner .lbl{font-size:12px;opacity:.85;margin-bottom:4px}
.profit-banner .amt{font-size:28px;font-weight:900}
.profit-banner .sub{font-size:13px;opacity:.9;margin-top:4px}
.quote-box{background:#fff;border:2px solid #0d2b50;border-radius:12px;padding:16px 20px;min-width:280px}
.quote-box-title{font-size:12px;font-weight:800;color:#0d2b50;margin-bottom:10px}
.quote-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #eee;font-size:13px}
.quote-row:last-child{border-bottom:none;font-weight:800;font-size:14px;color:#0d2b50}
.quote-row .ql{color:#555}
.quote-row .qv{font-weight:700;color:#0d2b50}

/* Action bar */
.action-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.btn-preview{background:#1a5f8c;color:#fff;border:none;padding:14px 24px;border-radius:8px;font-size:15px;font-weight:800;font-family:inherit;min-height:56px}
.btn-preview:active{background:#0d4f7c}
.btn-pdf{background:#c62828;color:#fff;border:none;padding:14px 32px;border-radius:8px;font-size:16px;font-weight:800;font-family:inherit;min-height:56px}
.btn-pdf:active{background:#b71c1c}

/* プレビューバー */
#preview-bar{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#0d2b50;color:#fff;padding:12px 20px;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#preview-bar span{font-weight:700;font-size:14px}
#preview-bar .btn-exit{background:#fff;color:#0d2b50;border:none;padding:10px 20px;border-radius:7px;font-size:14px;font-weight:800;font-family:inherit;min-height:44px}

/* プレビューモード */
.preview-mode #preview-bar{display:flex}
.preview-mode .app{padding-top:70px}
.preview-mode .hdr,
.preview-mode .topbar,
.preview-mode .settings-panel,
.preview-mode .row-cards,
.preview-mode .btn-add,
.preview-mode .banner-row,
.preview-mode #quote-summary-box,
.preview-mode .action-bar{display:none!important}
.preview-mode .tbl-section{box-shadow:none;border:1.5px solid #ccd;border-radius:8px}

/* 印刷 */
@media print{
  @page{size:A4 landscape;margin:10mm 10mm 6mm 10mm}
  body{background:#fff;font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo',sans-serif}
  .no-print{display:none!important}
  .mobile-totals{display:none!important}
  #preview-bar{display:none!important}
  .app{padding:0;max-width:100%}
  .tbl-section{box-shadow:none;padding:0;border-radius:0;overflow:visible;margin-bottom:6mm;border:none}
  .tbl-title{font-size:13px;margin-bottom:6px}
  table{display:table!important;min-width:auto;width:100%;font-size:10px}
  thead{display:table-header-group!important}
  tbody{display:table-row-group!important}
  tfoot{display:table-footer-group!important}
  tr{display:table-row!important;border:none!important;border-radius:0!important;padding:0!important;margin:0!important;background:none!important}
  tbody tr:nth-child(even){background:#f7f9fc!important}
  th,td{display:table-cell!important}
  thead tr{visibility:visible!important}
  tbody td::before{display:none!important}
  tbody td.td-detail{display:table-cell!important}
  tbody td.td-total{background:none!important;border-radius:0!important;margin:0!important;padding:5px 4px!important;font-size:inherit!important;border-top:none!important}
  tfoot tr{display:table-row!important;border-radius:0!important;padding:0!important}
  tfoot td{display:table-cell!important;text-align:right!important;padding:8px 6px!important;white-space:nowrap!important}
  tfoot td.l{text-align:left!important}
  thead th{padding:6px 4px;font-size:9.5px}
  tbody td{padding:5px 4px;white-space:nowrap!important}
  .tr-sub td{background:#ecf3fb!important;border-top:2px solid #1a5f8c!important}
  .tr-misc td{background:#fff8e1!important}
  .tr-disc td{background:#fef3f3!important}
  .tr-grand td{background:#0d2b50!important;color:#fff!important;font-size:11px}
  .tr-net td{background:#e8f5e9!important}
  .tr-quote td{background:#e3f2fd!important}
  .customer-quote-big{display:block!important;page-break-inside:avoid}
  .print-summary{display:block!important}
  .print-summary-inner{border:1.5px solid #0d2b50;border-radius:6px;padding:10px 14px;margin-top:6mm}
  .print-summary-row{display:flex!important;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee;font-size:11px}
  .print-summary-row:last-child{border-bottom:none;font-weight:800;font-size:12px}
  .print-company{font-size:11px;color:#0d2b50;font-weight:700;margin-bottom:3mm}
}
.print-summary{display:none}
</style>
</head>
<body>

<!-- プレビューバー（プレビューモード時に固定表示） -->
<div id="preview-bar">
  <span>プレビューモード — PDFに印刷される内容</span>
  <button type="button" class="btn-exit" onclick="exitPreview()">編集画面に戻る</button>
</div>

<div class="app">

  <!-- ヘッダー -->
  <div class="hdr no-print">
    <h1>ユーエス硝子　ガラス積算ツール</h1>
    <p>ガラス修理・交換用</p>
  </div>

  <!-- トップバー -->
  <div class="topbar no-print">
    <span class="tblabel">案件名</span>
    <input type="text" id="pname" placeholder="案件名・現場名（任意）" oninput="calc()">
    <span class="tblabel">表示モード</span>
    <div class="toggle-wrap">
      <button id="btn-int" class="tbtn on" type="button" onclick="setView('internal')">社内用</button>
      <button id="btn-cus" class="tbtn"    type="button" onclick="setView('customer')">元請け提出用</button>
    </div>
  </div>

  <!-- 設定パネル -->
  <div class="settings-panel no-print" id="settings-panel">
    <button type="button" class="settings-hdr" onclick="toggleSettings()">
      <span>⚙ 設定・見積書オプション</span>
      <span class="settings-hdr-arrow open" id="settings-arrow">▲</span>
    </button>
    <div class="settings-inner" id="settings-inner">

      <div class="sblock">
        <div class="sblock-title">案件設定</div>
        <div class="srow">
          <label style="font-weight:700;min-width:70px">諸経費</label>
          <label><input type="radio" name="miscMode" value="auto" checked onchange="calc()"> 自動</label>
          <label><input type="radio" name="miscMode" value="manual" onchange="calc()"> 手入力</label>
          <input type="number" id="misc-manual" value="0" min="0" step="100" placeholder="金額" style="width:100px" oninput="calc()">
        </div>
        <div class="srow">
          <label style="font-weight:700;min-width:70px">値引き名</label>
          <input type="text" id="disc-name" class="wide" placeholder="例：特別値引き" oninput="calc()">
        </div>
        <div class="srow">
          <label style="font-weight:700;min-width:70px">値引き金額</label>
          <input type="number" id="disc-amt" value="0" min="0" step="100" style="width:120px" oninput="calc()">
          <label style="font-size:12px;color:#888">円（税抜）</label>
        </div>
        <div style="margin-top:10px">
          <div class="sblock-title" style="margin-bottom:6px">元請け用倍率</div>
          <div class="mult-grid">
            <div class="mult-item"><label>ガラス</label><input type="number" id="m-glass" value="1.25" step="0.01" min="0" oninput="calc()"></div>
            <div class="mult-item"><label>施工</label><input type="number" id="m-const" value="1.75" step="0.01" min="0" oninput="calc()"></div>
            <div class="mult-item"><label>CK</label><input type="number" id="m-caulk" value="1.48" step="0.01" min="0" oninput="calc()"></div>
            <div class="mult-item"><label>CK剥がし</label><input type="number" id="m-remov" value="1.48" step="0.01" min="0" oninput="calc()"></div>
            <div class="mult-item"><label>廃棄</label><input type="number" id="m-disp" value="1.00" step="0.01" min="0" oninput="calc()"></div>
          </div>
        </div>
      </div>

      <div class="sblock">
        <div class="sblock-title">見積書設定</div>
        <div class="srow">
          <label style="font-weight:700;min-width:90px">見積書タイトル</label>
          <input type="text" id="q-title" class="wide" value="お見積書" oninput="calc()">
        </div>
        <div class="srow">
          <label style="font-weight:700;min-width:90px">宛名</label>
          <input type="text" id="q-addr" class="wide" placeholder="例：〇〇株式会社 御中" oninput="calc()">
        </div>
        <div class="srow">
          <label style="font-weight:700;min-width:90px">案件名</label>
          <input type="text" id="q-case" class="wide" placeholder="見積書用案件名" oninput="calc()">
        </div>
        <div class="srow">
          <label style="font-weight:700;min-width:90px">発行日</label>
          <input type="text" id="q-date" class="wide" placeholder="例：2026年5月14日" oninput="calc()">
        </div>
        <div class="srow">
          <label style="font-weight:700;min-width:90px">見積番号</label>
          <input type="text" id="q-num" style="width:130px" placeholder="例：Q-2026-001" oninput="calc()">
        </div>
        <div class="srow">
          <label style="font-weight:700;min-width:90px">備考</label>
          <input type="text" id="q-notes" class="wide" placeholder="備考・注意事項" oninput="calc()">
        </div>
        <div style="margin-top:10px;border-top:1px solid #dde;padding-top:10px">
          <div class="srow">
            <label style="font-weight:700;min-width:90px">NET金額</label>
            <label><input type="radio" name="netMode" value="auto" checked onchange="calc()"> 自動</label>
            <label><input type="radio" name="netMode" value="manual" onchange="calc()"> 手入力</label>
            <input type="number" id="net-manual" value="0" min="0" step="100" style="width:110px" oninput="calc()">
            <label><input type="radio" name="netTax" value="excl" checked onchange="calc()"> 税抜</label>
            <label><input type="radio" name="netTax" value="incl" onchange="calc()"> 税込</label>
          </div>
          <div class="srow">
            <label style="font-weight:700;min-width:90px">NET表示</label>
            <label><input type="checkbox" id="show-net" checked onchange="calc()"> NET金額を表示する</label>
          </div>
          <div class="srow">
            <label style="font-weight:700;min-width:90px">お見積書金額</label>
            <label><input type="radio" name="qaMode" value="detail" checked onchange="calc()"> 明細別倍率</label>
            <label><input type="radio" name="qaMode" value="net_mult" onchange="calc()"> NET倍率</label>
            <label><input type="radio" name="qaMode" value="manual" onchange="calc()"> 手入力</label>
          </div>
          <div class="srow" id="qa-net-mult-row" style="display:none">
            <label style="min-width:90px"></label>
            <label style="font-size:12px">NET倍率</label>
            <input type="number" id="qa-net-mult" value="1.25" step="0.01" min="0" style="width:90px" oninput="calc()">
          </div>
          <div class="srow" id="qa-manual-row" style="display:none">
            <label style="min-width:90px"></label>
            <input type="number" id="qa-manual" value="0" min="0" step="100" style="width:130px" oninput="calc()">
            <label><input type="radio" name="qaTax" value="excl" checked onchange="calc()"> 税抜</label>
            <label><input type="radio" name="qaTax" value="incl" onchange="calc()"> 税込</label>
          </div>
          <div class="srow">
            <label style="font-weight:700;min-width:90px">金額表示</label>
            <label><input type="checkbox" id="show-qa" checked onchange="calc()"> お見積書金額を表示する</label>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 行カード -->
  <div id="row-cards" class="row-cards no-print"></div>
  <button type="button" class="btn-add no-print" onclick="addRow()">＋ 明細を追加</button>

  <!-- テーブルセクション -->
  <div class="tbl-section">
    <div id="tbl-title" class="tbl-title no-print">【社内用】 積算明細</div>
    <div id="tbl-body"></div>
  </div>

  <!-- 印刷用サマリー -->
  <div class="print-summary" id="print-summary"></div>

  <!-- バナー -->
  <div class="banner-row no-print">
    <div class="total-banner">
      <div class="lbl" id="total-lbl">合計金額</div>
      <div class="amt" id="total-amt">¥ 0</div>
    </div>
    <div id="profit-sec" class="profit-banner">
      <div class="lbl">粗利</div>
      <div class="amt" id="profit-amt">¥ 0</div>
      <div class="sub" id="profit-rate">粗利率 0.0%</div>
    </div>
  </div>

  <div id="quote-summary-box" class="quote-box no-print" style="margin-bottom:14px;max-width:500px">
    <div class="quote-box-title">見積書サマリー</div>
    <div id="quote-summary-inner"></div>
  </div>

  <!-- アクションバー -->
  <div class="action-bar no-print">
    <button type="button" class="btn-preview" onclick="previewPDF()">PDF確認プレビュー</button>
    <button type="button" class="btn-pdf" onclick="window.print()">PDF出力（A4 横）</button>
  </div>

</div><!-- /.app -->

<script>
'use strict';

/* ══════════════════════════════════════════════
   定数
══════════════════════════════════════════════ */
var GP = {
  'FL2':1560,'FL3':1840,'FL5':1710,'FL6':2130,'FL8':3500,'FL10':4800,
  'F6':4560,'Fw':5100,'pw':8100,
  'Yカガミ3':3530,'Yカガミ5':4940,'Yカガミ6':6000,
  '3+3透明':7100,'4+4透明':8900,'5+5透明':10600,
  '3+3乳半':10600,'4+4乳半':12300,
  'ラミブロック3+3透明':7800,'ラミブロック4+4透明':11300,
  'ラミブロック3+3乳半':10400,'ラミブロック4+4乳半':13000,
  '耐熱5':45000,'耐熱8':93000
};

var CR = {
  'FL5':1100,'FL6':1200,'FL8':1400,'FL10':2000,'FL12':3000,
  'F6':1200,'Fw':1300,'pw':1300
};

var CUSTOM_TYPES = {'自由入力':1,'複層ガラス':1,'LOW-E複層':1,'特注品':1};
var MIRRORS      = {'Yカガミ3':1,'Yカガミ5':1,'Yカガミ6':1};

var viewMode = 'internal';
var rid = 0;

/* ══════════════════════════════════════════════
   ヘルパー
══════════════════════════════════════════════ */
function fmt(n){ return Math.round(n).toLocaleString('ja-JP'); }
function fmtA(n){ return (+n).toFixed(3); }
function gv(id){ return document.getElementById(id); }
function getRate(t){ return CR[t] !== undefined ? CR[t] : 1200; }
function isCustom(t){ return !!CUSTOM_TYPES[t]; }
function isMirror(t){ return !!MIRRORS[t]; }

function radio(scope, name){
  var el = scope.querySelector('input[name="' + name + '"]:checked');
  return el ? el.value : '';
}

function globalRadio(name){
  var el = document.querySelector('input[name="' + name + '"]:checked');
  return el ? el.value : '';
}

function escH(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ══════════════════════════════════════════════
   設定読み取り
══════════════════════════════════════════════ */
function readSettings(){
  var miscMode   = globalRadio('miscMode') || 'auto';
  var miscManual = parseFloat((gv('misc-manual')||{value:0}).value) || 0;
  var discName   = (gv('disc-name')||{value:''}).value || '';
  var discAmt    = parseFloat((gv('disc-amt')||{value:0}).value) || 0;
  var multG  = parseFloat((gv('m-glass')||{value:1.25}).value) || 1.25;
  var multC  = parseFloat((gv('m-const')||{value:1.75}).value) || 1.75;
  var multK  = parseFloat((gv('m-caulk')||{value:1.48}).value) || 1.48;
  var multKR = parseFloat((gv('m-remov')||{value:1.48}).value) || 1.48;
  var multD  = parseFloat((gv('m-disp') ||{value:1.00}).value) || 1.00;
  return {miscMode:miscMode, miscManual:miscManual,
          discName:discName, discAmt:discAmt,
          multG:multG, multC:multC, multK:multK, multKR:multKR, multD:multD};
}

function readQuote(){
  var title      = (gv('q-title') ||{value:'お見積書'}).value || 'お見積書';
  var addressee  = (gv('q-addr')  ||{value:''}).value || '';
  var caseName   = (gv('q-case')  ||{value:''}).value || '';
  var date       = (gv('q-date')  ||{value:''}).value || '';
  var number     = (gv('q-num')   ||{value:''}).value || '';
  var notes      = (gv('q-notes') ||{value:''}).value || '';
  var showNET    = gv('show-net') ? gv('show-net').checked : true;
  var showQA     = gv('show-qa')  ? gv('show-qa').checked  : true;
  var netMode    = globalRadio('netMode') || 'auto';
  var netManual  = parseFloat((gv('net-manual')||{value:0}).value) || 0;
  var netTax     = globalRadio('netTax') || 'excl';
  var qaMode     = globalRadio('qaMode') || 'detail';
  var qaNM       = parseFloat((gv('qa-net-mult')||{value:1.25}).value) || 1.25;
  var qaManual   = parseFloat((gv('qa-manual')  ||{value:0}).value) || 0;
  var qaTax      = globalRadio('qaTax') || 'excl';
  return {title:title, addressee:addressee, caseName:caseName, date:date,
          number:number, notes:notes, showNET:showNET, showQA:showQA,
          netMode:netMode, netManual:netManual, netTax:netTax,
          qaMode:qaMode, netMult:qaNM, qaManual:qaManual, qaTax:qaTax};
}

/* ══════════════════════════════════════════════
   行データ読み取り
══════════════════════════════════════════════ */
function getRowData(el){
  var id = el.dataset.rid;
  var glassType = el.querySelector('.ig').value;
  var priceMode = radio(el, 'pm' + id) || 'sqm';
  return {
    w:           parseFloat(el.querySelector('.iw').value) || 0,
    h:           parseFloat(el.querySelector('.ih').value) || 0,
    q:           parseInt(  el.querySelector('.iq').value) || 0,
    g:           glassType,
    customName:  (el.querySelector('.custom-name') ||{value:''}).value || '',
    priceMode:   priceMode,
    customSqm:   parseFloat((el.querySelector('.custom-sqm')  ||{value:0}).value) || 0,
    customMat:   parseFloat((el.querySelector('.custom-mat')  ||{value:0}).value) || 0,
    customSell:  parseFloat((el.querySelector('.custom-sell') ||{value:0}).value) || 0,
    customMatC:  parseFloat((el.querySelector('.custom-matc') ||{value:0}).value) || 0,
    sellMult:    parseFloat((el.querySelector('.sell-mult')   ||{value:2.0}).value) || 2.0,
    constRate:   parseFloat((el.querySelector('.const-rate')  ||{value:''}).value) || 0,
    fix:         radio(el, 'fix' + id) || 'caulking',
    rem:         radio(el, 'rem' + id) === '1',
    fire:        radio(el, 'fir' + id) === '1',
    ckRemoval:   radio(el, 'ckr' + id) === '1',
    disposal:    radio(el, 'dsp' + id) === '1',
    caulkRate:   parseFloat((el.querySelector('.caulk-rate')   ||{value:0}).value) || 0,
    removalRate: parseFloat((el.querySelector('.removal-rate') ||{value:0}).value) || 0,
    addName:     (el.querySelector('.add-name')   ||{value:''}).value || '',
    addAmt:      parseFloat((el.querySelector('.add-amount')  ||{value:0}).value) || 0,
    addInCost:   el.querySelector('.add-in-cost')  ? el.querySelector('.add-in-cost').checked  : false,
    addInSales:  el.querySelector('.add-in-sales') ? el.querySelector('.add-in-sales').checked : false,
    addInCust:   el.querySelector('.add-in-cust')  ? el.querySelector('.add-in-cust').checked  : false
  };
}

/* ══════════════════════════════════════════════
   行計算
══════════════════════════════════════════════ */
function calcRow(d){
  var w = d.w, h = d.h, q = d.q;
  var area = w * h / 1000000;
  var mult = d.sellMult || 2.0;
  var mirror = isMirror(d.g);
  var custom = isCustom(d.g);

  /* 材料原価・ガラス売価 */
  var materialCost, glassPrice;
  if(custom){
    if(d.priceMode === 'sqm'){
      materialCost = Math.round(d.customSqm * area * q * 1.10);
      glassPrice   = Math.round(materialCost * mult);
    } else if(d.priceMode === 'mat'){
      materialCost = d.customMat;
      glassPrice   = Math.round(materialCost * mult);
    } else {
      materialCost = d.customMatC || 0;
      glassPrice   = d.customSell;
    }
  } else {
    var up = GP[d.g] || 0;
    materialCost = Math.round(up * area * q * 1.10);
    glassPrice   = Math.round(materialCost * mult);
  }

  /* 施工 */
  var constructionBase, removalCost;
  if(mirror){
    constructionBase = 5000 * q;
    removalCost = 0;
  } else {
    var cr = d.constRate > 0 ? d.constRate : getRate(d.g);
    constructionBase = Math.round(area * cr * q * 2);
    removalCost      = d.rem ? Math.round(area * cr * q) : 0;
  }

  /* コーキング */
  var caulkingCost = 0, caulkingRemoval = 0, caulkMeters = 0;
  var ckrRate = 0;
  if(d.fix === 'caulking'){
    caulkMeters = ((w + h) / 1000) * 4 * q;
    var ckr = d.caulkRate > 0 ? d.caulkRate : (d.fire ? 700 : 300);
    caulkingCost = Math.round(caulkMeters * ckr);
    /* 剥がし代：「あり」の場合のみ計算 */
    if(d.ckRemoval){
      ckrRate = d.removalRate > 0 ? d.removalRate : 300;
      caulkingRemoval = Math.round(caulkMeters * ckrRate);
    }
  }

  /* 廃棄代：「あり」の場合のみ */
  var disposalCost = d.disposal ? (q * 1000) : 0;

  /* 追加費用 */
  var addAmt = d.addAmt || 0;

  /* 行合計（社内） */
  var rowTotal = glassPrice + constructionBase + removalCost
               + caulkingCost + caulkingRemoval + disposalCost
               + (d.addInSales ? addAmt : 0);

  /* 粗利（社内） */
  var profitRow = rowTotal - materialCost - (d.addInCost ? addAmt : 0);

  return {
    area:area, materialCost:materialCost, glassPrice:glassPrice,
    constructionBase:constructionBase, removalCost:removalCost,
    caulkMeters:caulkMeters, caulkingCost:caulkingCost,
    caulkingRemoval:caulkingRemoval, ckrRate:ckrRate,
    disposalCost:disposalCost, addAmt:addAmt,
    rowTotal:rowTotal, profitRow:profitRow,
    mult:mult, cr: d.constRate > 0 ? d.constRate : getRate(d.g),
    mirror:mirror, custom:custom
  };
}

/* ══════════════════════════════════════════════
   メイン計算
══════════════════════════════════════════════ */
function calc(){
  var cards = document.querySelectorAll('.row-card');
  var datas = [], calcs = [];
  for(var i = 0; i < cards.length; i++){
    var d = getRowData(cards[i]);
    datas.push(d);
    calcs.push(calcRow(d));
  }

  var s = readSettings();
  var q = readQuote();

  /* 諸経費 */
  var totalQty = 0;
  for(var i = 0; i < datas.length; i++) totalQty += datas[i].q;
  var misc;
  if(s.miscMode === 'auto'){
    misc = totalQty >= 4 ? 15000 : (totalQty >= 1 ? 7500 : 0);
  } else {
    misc = s.miscManual;
  }

  /* 社内合計 */
  var iSumGP=0,iSumCC=0,iSumRC=0,iSumCK=0,iSumCKR=0,iSumDC=0,iSumADD=0,iSumMAT=0;
  for(var i = 0; i < calcs.length; i++){
    var c = calcs[i];
    iSumGP  += c.glassPrice;
    iSumCC  += c.constructionBase;
    iSumRC  += c.removalCost;
    iSumCK  += c.caulkingCost;
    iSumCKR += c.caulkingRemoval;
    iSumDC  += c.disposalCost;
    iSumMAT += c.materialCost;
    if(datas[i].addInSales) iSumADD += c.addAmt;
  }
  var iSub   = iSumGP + iSumCC + iSumRC + iSumCK + iSumCKR + iSumDC + iSumADD;
  var iGrand = iSub + misc - s.discAmt;
  var iProfit = 0;
  for(var i = 0; i < calcs.length; i++) iProfit += calcs[i].profitRow;
  iProfit = iProfit + misc - s.discAmt;
  var profitRate = iGrand > 0 ? (iProfit / iGrand * 100) : 0;

  /* 元請け用表示値 */
  var cDisp = [];
  for(var i = 0; i < calcs.length; i++){
    var c = calcs[i], dd = datas[i];
    cDisp.push({
      glassPrice:       Math.round(c.glassPrice       * s.multG),
      constructionBase: Math.round(c.constructionBase * s.multC),
      removalCost:      Math.round(c.removalCost      * s.multC),
      caulkingCost:     Math.round(c.caulkingCost     * s.multK),
      caulkingRemoval:  Math.round(c.caulkingRemoval  * s.multKR),
      disposalCost:     Math.round(c.disposalCost     * s.multD),
      addAmt:           dd.addInCust ? c.addAmt : 0
    });
  }

  var cSumGP=0,cSumCC=0,cSumRC=0,cSumCK=0,cSumCKR=0,cSumDC=0,cSumADD=0;
  for(var i = 0; i < cDisp.length; i++){
    var cd = cDisp[i];
    cSumGP  += cd.glassPrice;
    cSumCC  += cd.constructionBase;
    cSumRC  += cd.removalCost;
    cSumCK  += cd.caulkingCost;
    cSumCKR += cd.caulkingRemoval;
    cSumDC  += cd.disposalCost;
    cSumADD += cd.addAmt;
  }
  var cSub   = cSumGP + cSumCC + cSumRC + cSumCK + cSumCKR + cSumDC + cSumADD;
  var cGrand = cSub + misc - s.discAmt;

  var totals = {
    iSumGP:iSumGP, iSumCC:iSumCC, iSumRC:iSumRC,
    iSumCK:iSumCK, iSumCKR:iSumCKR, iSumDC:iSumDC, iSumADD:iSumADD,
    iSumMAT:iSumMAT, iSub:iSub, iGrand:iGrand,
    iProfit:iProfit, profitRate:profitRate,
    cSumGP:cSumGP, cSumCC:cSumCC, cSumRC:cSumRC,
    cSumCK:cSumCK, cSumCKR:cSumCKR, cSumDC:cSumDC, cSumADD:cSumADD,
    cSub:cSub, cGrand:cGrand,
    misc:misc, totalQty:totalQty
  };

  /* NET金額 */
  var netAmt;
  if(q.netMode === 'auto'){
    netAmt = iGrand;
  } else {
    netAmt = q.netTax === 'incl' ? Math.round(q.netManual / 1.1) : q.netManual;
  }

  /* お見積書金額 */
  var quoteAmt;
  if(q.qaMode === 'detail'){
    quoteAmt = cGrand;
  } else if(q.qaMode === 'net_mult'){
    quoteAmt = Math.round(netAmt * q.netMult);
  } else {
    quoteAmt = q.qaTax === 'incl' ? Math.round(q.qaManual / 1.1) : q.qaManual;
  }

  renderTable(datas, calcs, cDisp, s, totals, netAmt, quoteAmt, q);
  renderSummary(totals, netAmt, quoteAmt, s, q);
  renderPrintSummary(totals, netAmt, quoteAmt, s, q);
}

/* ══════════════════════════════════════════════
   テーブル描画
══════════════════════════════════════════════ */
function makeMiscLabel(totals){
  var label = totals.totalQty >= 4 ? '4枚以上' : '1〜3枚';
  return '諸経費（総枚数 ' + totals.totalQty + ' 枚 ／ ' + label + '）';
}

function renderTable(datas, calcs, cDisp, s, totals, netAmt, quoteAmt, q){
  var isInt = viewMode === 'internal';
  var rows = datas.length;
  var h = '';

  if(isInt){
    /* 社内用 21列 */
    h += '<table><thead><tr>';
    h += '<th>No.</th><th>寸法(mm)</th><th>品名</th><th>枚数</th><th>面積(m²)</th>';
    h += '<th>材料単価</th><th>材料原価</th><th>倍率</th><th>ガラス売価</th>';
    h += '<th>施工単価</th><th>施工工賃</th><th>取外代</th>';
    h += '<th>CK m数</th><th>CK単価</th><th>CK費</th><th>剥単価</th><th>剥費</th>';
    h += '<th>廃棄代</th><th>追加費用</th><th>行合計</th><th>粗利</th>';
    h += '</tr></thead><tbody>';

    for(var i = 0; i < rows; i++){
      var d = datas[i], c = calcs[i];
      var dim = (d.w && d.h) ? d.w + ' × ' + d.h : '—';
      var pname = (d.customName && isCustom(d.g)) ? d.customName : d.g;
      var ckr_disp = d.caulkRate > 0 ? d.caulkRate : (d.fire ? 700 : 300);
      var up = isCustom(d.g) ? (d.priceMode === 'sqm' ? d.customSqm : '—') : (GP[d.g] || 0);
      var rowT = c.glassPrice + c.constructionBase + c.removalCost
               + c.caulkingCost + c.caulkingRemoval + c.disposalCost
               + (d.addInSales ? c.addAmt : 0);
      h += '<tr>';
      h += '<td class="c" data-label="No.">' + (i+1) + '</td>';
      h += '<td class="l" data-label="寸法">' + dim + '</td>';
      h += '<td class="l" data-label="品名">' + escH(pname) + '</td>';
      h += '<td class="c" data-label="枚数">' + (d.q || '—') + '</td>';
      h += '<td class="td-detail" data-label="面積">' + fmtA(c.area) + '</td>';
      h += '<td class="td-detail" data-label="材料単価">' + (typeof up === 'number' ? fmt(up) : up) + '</td>';
      h += '<td class="td-detail" data-label="材料原価">' + fmt(c.materialCost) + '</td>';
      h += '<td class="c td-detail" data-label="倍率">×' + c.mult.toFixed(2) + '</td>';
      h += '<td data-label="ガラス売価">' + fmt(c.glassPrice) + '</td>';
      h += '<td class="td-detail" data-label="施工単価">' + (c.mirror ? '(定額)' : fmt(c.cr)) + '</td>';
      h += '<td data-label="施工工賃">' + fmt(c.constructionBase) + '</td>';
      h += '<td data-label="取外代">' + fmt(c.removalCost) + '</td>';
      h += '<td class="td-detail" data-label="CK m数">' + (d.fix === 'caulking' ? fmtA(c.caulkMeters) : '0.000') + '</td>';
      h += '<td class="td-detail" data-label="CK単価">' + (d.fix === 'caulking' ? fmt(ckr_disp) : '—') + '</td>';
      h += '<td data-label="CK費">' + fmt(c.caulkingCost) + '</td>';
      h += '<td class="td-detail" data-label="剥単価">' + (d.fix === 'caulking' && d.ckRemoval ? fmt(c.ckrRate) : '—') + '</td>';
      h += '<td data-label="剥費">' + (c.caulkingRemoval > 0 ? fmt(c.caulkingRemoval) : '0') + '</td>';
      h += '<td data-label="廃棄代">' + (c.disposalCost > 0 ? fmt(c.disposalCost) : '0') + '</td>';
      h += '<td data-label="追加費用">' + (c.addAmt > 0 ? fmt(c.addAmt) : '—') + '</td>';
      h += '<td class="td-total" data-label="行合計"><strong>' + fmt(rowT) + '</strong></td>';
      h += '<td data-label="粗利">' + fmt(c.profitRow) + '</td>';
      h += '</tr>';
    }
    h += '</tbody><tfoot>';
    h += '<tr class="tr-sub">';
    h += '<td colspan="4" class="l">小計</td><td>—</td><td>—</td>';
    h += '<td>' + fmt(totals.iSumMAT) + '</td><td>—</td>';
    h += '<td>' + fmt(totals.iSumGP) + '</td><td>—</td>';
    h += '<td>' + fmt(totals.iSumCC) + '</td><td>' + fmt(totals.iSumRC) + '</td>';
    h += '<td>—</td><td>—</td><td>' + fmt(totals.iSumCK) + '</td>';
    h += '<td>—</td><td>' + fmt(totals.iSumCKR) + '</td>';
    h += '<td>' + fmt(totals.iSumDC) + '</td><td>' + fmt(totals.iSumADD) + '</td>';
    h += '<td><strong>' + fmt(totals.iSub) + '</strong></td><td>—</td></tr>';
    h += '<tr class="tr-misc"><td colspan="20" class="l">' + makeMiscLabel(totals) + '</td>';
    h += '<td><strong>' + fmt(totals.misc) + '</strong></td></tr>';
    if(s.discAmt > 0){
      h += '<tr class="tr-disc"><td colspan="20" class="l">値引き' + (s.discName ? ' （' + escH(s.discName) + '）' : '') + '</td>';
      h += '<td><strong>▲ ' + fmt(s.discAmt) + '</strong></td></tr>';
    }
    h += '<tr class="tr-grand"><td colspan="20" class="l">合計金額</td>';
    h += '<td><strong>' + fmt(totals.iGrand) + '</strong></td></tr>';
    h += '</tfoot></table>';

    /* モバイル合計 */
    h += '<div class="mobile-totals">';
    h += '<div class="mt-row" style="background:#ecf3fb;border-top:2px solid #1a5f8c"><span>小計</span><span>' + fmt(totals.iSub) + '</span></div>';

      var pname = (d.customName && isCustom(d.g)) ? d.customName : d.g;

      h += '<td data-label="施工工賃">' + fmt(cd.constructionBase + cd.removalCost) + '</td>';
      h += '<td data-label="CK費">' + fmt(cd.caulkingCost) + '</td>';
      h += '<td data-label="CK剥がし代">' + (cd.caulkingRemoval > 0 ? fmt(cd.caulkingRemoval) : '0') + '</td>';
      h += '<td data-label="廃棄代">' + (cd.disposalCost > 0 ? fmt(cd.disposalCost) : '0') + '</td>';
      h += '<td data-label="追加費用">' + (cd.addAmt > 0 ? fmt(cd.addAmt) : '—') + '</td>';
      h += '<td class="td-total" data-label="行合計"><strong>' + fmt(rowT) + '</strong></td>';
      h += '</tr>';
    }
    h += '</tbody><tfoot>';
    h += '<tr class="tr-sub"><td colspan="4" class="l">小計</td>';
    h += '<td>' + fmt(totals.cSumGP) + '</td>';
    h += '<td>' + fmt(totals.cSumCC + totals.cSumRC) + '</td>';
    h += '<td>' + fmt(totals.cSumCK) + '</td>';
    h += '<td>' + fmt(totals.cSumCKR) + '</td>';
    h += '<td>' + fmt(totals.cSumDC) + '</td>';
    h += '<td>' + fmt(totals.cSumADD) + '</td>';
    h += '<td><strong>' + fmt(totals.cSub) + '</strong></td></tr>';
    h += '<tr class="tr-misc"><td colspan="10" class="l">' + makeMiscLabel(totals) + '</td>';
    h += '<td><strong>' + fmt(totals.misc) + '</strong></td></tr>';
    if(s.discAmt > 0){
      h += '<tr class="tr-disc"><td colspan="10" class="l">値引き' + (s.discName ? ' （' + escH(s.discName) + '）' : '') + '</td>';
      h += '<td><strong>▲ ' + fmt(s.discAmt) + '</strong></td></tr>';
    }
    h += '<tr class="tr-grand"><td colspan="10" class="l"><strong>見積金額合計</strong></td>';
    h += '<td><strong>' + fmt(totals.cGrand) + '</strong></td></tr>';

      h += '<td><strong>' + fmt(netAmt) + '</strong></td></tr>';

    if(q.showQA){

      h += '<td><strong>' + fmt(quoteAmt) + '</strong></td></tr>';

    /* お見積書金額 大表示 */
    if(q.showQA){
      h += '<div class="customer-quote-big">';
      h += '<div class="cqb-label">お見積書金額（税抜）</div>';
      h += '<div class="cqb-amount">¥ ' + fmt(quoteAmt) + '</div>';
      h += '<div class="cqb-sub">（税込　¥ ' + fmt(Math.round(quoteAmt * 1.1)) + '）</div>';

    }

    h += '<div class="mobile-totals">';
    h += '<div class="mt-row" style="background:#ecf3fb;border-top:2px solid #1a5f8c"><span>小計</span><span>' + fmt(totals.cSub) + '</span></div>';
    h += '<div class="mt-row" style="background:#fff8e1"><span>' + makeMiscLabel(totals) + '</span><span>' + fmt(totals.misc) + '</span></div>';
    if(s.discAmt > 0) h += '<div class="mt-row" style="background:#fef3f3"><span>値引き</span><span>▲ ' + fmt(s.discAmt) + '</span></div>';
    h += '<div class="mt-row" style="background:#0d2b50;color:#fff;font-weight:800"><span>見積金額合計</span><span>' + fmt(totals.cGrand) + '</span></div>';

  gv('tbl-body').innerHTML = h;

/* ══════════════════════════════════════════════
   サマリー描画
══════════════════════════════════════════════ */
function renderSummary(totals, netAmt, quoteAmt, s, q){
  var isInt = viewMode === 'internal';
  var grand = isInt ? totals.iGrand : totals.cGrand;

  gv('total-lbl').textContent = isInt ? '合計金額（社内）' : '見積金額合計（元請け）';
  gv('total-amt').textContent = '¥ ' + fmt(grand);

  var ps = gv('profit-sec');
  if(isInt){
    ps.style.display = '';
    gv('profit-amt').textContent = '¥ ' + fmt(totals.iProfit);
    gv('profit-rate').textContent = '粗利率 ' + totals.profitRate.toFixed(1) + '%';
  } else {
    ps.style.display = 'none';
  }

  var diff = quoteAmt - netAmt;
  var qh = '';
  if(q.showNET){
    qh += '<div class="quote-row"><span class="ql">NET金額（税抜）</span><span class="qv">¥ ' + fmt(netAmt) + '</span></div>';
    qh += '<div class="quote-row"><span class="ql">NET金額（税込）</span><span class="qv">¥ ' + fmt(Math.round(netAmt * 1.1)) + '</span></div>';
  }
  if(q.showQA){
    qh += '<div class="quote-row"><span class="ql">お見積書金額（税抜）</span><span class="qv">¥ ' + fmt(quoteAmt) + '</span></div>';
    qh += '<div class="quote-row"><span class="ql">お見積書金額（税込）</span><span class="qv">¥ ' + fmt(Math.round(quoteAmt * 1.1)) + '</span></div>';
  }
  if(q.showNET && q.showQA){
    qh += '<div class="quote-row"><span class="ql">差額（お見積書 − NET）</span><span class="qv">' + (diff >= 0 ? '' : '-') + '¥ ' + fmt(Math.abs(diff)) + '</span></div>';
  }
  gv('quote-summary-inner').innerHTML = qh || '<div style="color:#999;font-size:12px">見積書設定で金額を確認できます</div>';

  var pn = (gv('pname') || {value:''}).value;
  var ttl = isInt ? '【社内用】 積算明細' : '【元請け提出用】 見積明細';
  if(pn) ttl += ' — ' + pn;
  gv('tbl-title').textContent = ttl;
}

/* ══════════════════════════════════════════════
   印刷用サマリー描画
══════════════════════════════════════════════ */
function renderPrintSummary(totals, netAmt, quoteAmt, s, q){
  var isInt = viewMode === 'internal';
  var ph = '<div class="print-summary-inner">';
  ph += '<div class="print-company">ユーエス硝子</div>';
  if(q.addressee) ph += '<div style="font-size:11px;margin-bottom:2mm">' + escH(q.addressee) + '</div>';
  if(q.caseName)  ph += '<div style="font-size:11px;margin-bottom:2mm">案件：' + escH(q.caseName) + '</div>';
  if(q.date)      ph += '<div style="font-size:10px;color:#555;margin-bottom:2mm">発行日：' + escH(q.date) + '</div>';
  if(q.number)    ph += '<div style="font-size:10px;color:#555;margin-bottom:2mm">見積番号：' + escH(q.number) + '</div>';
  if(isInt){
    ph += '<div class="print-summary-row"><span>合計金額（社内）</span><span>¥ ' + fmt(totals.iGrand) + '</span></div>';
    ph += '<div class="print-summary-row"><span>粗利</span><span>¥ ' + fmt(totals.iProfit) + '　（粗利率 ' + totals.profitRate.toFixed(1) + '%）</span></div>';
  } else {
    ph += '<div class="print-summary-row"><span>見積金額合計（税抜）</span><span>¥ ' + fmt(totals.cGrand) + '</span></div>';
    ph += '<div class="print-summary-row"><span>見積金額合計（税込）</span><span>¥ ' + fmt(Math.round(totals.cGrand * 1.1)) + '</span></div>';
    if(q.showNET) ph += '<div class="print-summary-row"><span>NET金額（税抜）</span><span>¥ ' + fmt(netAmt) + '</span></div>';
    if(q.showQA){
      ph += '<div class="print-summary-row"><span>お見積書金額（税抜）</span><span>¥ ' + fmt(quoteAmt) + '</span></div>';
      ph += '<div class="print-summary-row"><span>お見積書金額（税込）</span><span>¥ ' + fmt(Math.round(quoteAmt * 1.1)) + '</span></div>';
    }
  }
  if(q.notes) ph += '<div style="font-size:10px;color:#555;margin-top:2mm;border-top:1px solid #ddd;padding-top:2mm">備考：' + escH(q.notes) + '</div>';
  ph += '</div>';
  gv('print-summary').innerHTML = ph;
}

  var inner = gv('settings-inner');

   行番号更新
══════════════════════════════════════════════ */
function renumber(){
  var cards = document.querySelectorAll('.row-card');
  for(var i = 0; i < cards.length; i++){
    var n = cards[i].querySelector('.rnum');
    if(n) n.textContent = i + 1;
    var b = cards[i].querySelector('.btn-del');
    if(b) b.style.display = cards.length > 1 ? '' : 'none';
  }
}

/* ══════════════════════════════════════════════
   行カードの動的表示制御
══════════════════════════════════════════════ */
function updateRow(card){
  if(!card) return;
  var id = card.dataset.rid;
  var gType = card.querySelector('.ig').value;
  var cf  = card.querySelector('.custom-fields');
  var ckf = card.querySelector('.caulk-fields');

  if(cf) cf.style.display = isCustom(gType) ? '' : 'none';

  var fixVal = radio(card, 'fix' + id);
  if(ckf) ckf.style.display = (fixVal === 'caulking') ? '' : 'none';

  var priceMode = radio(card, 'pm' + id);
  var sqmRow  = card.querySelector('.pm-sqm-row');
  var matRow  = card.querySelector('.pm-mat-row');
  var sellRow = card.querySelector('.pm-sell-row');
  if(sqmRow)  sqmRow.style.display  = (priceMode === 'sqm')  ? '' : 'none';
  if(matRow)  matRow.style.display  = (priceMode === 'mat')  ? '' : 'none';
  if(sellRow) sellRow.style.display = (priceMode === 'sell') ? '' : 'none';
}

}

            <label><input type="checkbox" class="add-in-cost"  onchange="calc()"> 原価に含む</label>

            <label><input type="checkbox" class="add-in-cust"  onchange="calc()"> 元請け用に表示</label>
          </div>
        </div>
      </div>

    </div>
  `;

  gv('row-cards').appendChild(div);
  renumber();
  calc();
}

/* ══════════════════════════════════════════════
   行削除
══════════════════════════════════════════════ */
function delRow(id){
  var el = gv(id);
  if(el) el.parentNode.removeChild(el);
  renumber();
  calc();
}

/* ══════════════════════════════════════════════
   設定パネルのラジオ変更検知
══════════════════════════════════════════════ */
document.addEventListener('change', function(e){
  if(e.target.name === 'qaMode') updateSettings();
});

/* ══════════════════════════════════════════════
   初期化
══════════════════════════════════════════════ */
addRow();
</script>
</body>
</html>
