<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ユーエス硝子 ガラス積算ツール</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
      background: #eef1f5;
      color: #1a1a2e;
      font-size: 14px;
      min-height: 100vh;
    }

    .app { max-width: 1400px; margin: 0 auto; padding: 16px; }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #0d2b50 0%, #1a5f8c 100%);
      color: white;
      padding: 18px 24px;
      border-radius: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
    }
    .header h1 { font-size: 20px; font-weight: 800; letter-spacing: .03em; }
    .header .sub { font-size: 12px; opacity: .75; margin-top: 3px; }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      gap: 10px;
      align-items: center;
      background: white;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      flex-wrap: wrap;
    }
    .topbar label { font-weight: 700; font-size: 13px; white-space: nowrap; }
    .topbar .project-input {
      flex: 1;
      min-width: 180px;
      padding: 7px 12px;
      border: 1.5px solid #ccc;
      border-radius: 7px;
      font-family: inherit;
      font-size: 14px;
    }
    .topbar .project-input:focus { outline: none; border-color: #1a5f8c; }

    /* ── Toggle buttons ── */
    .toggle-wrap {
      display: flex;
      gap: 0;
      border: 2px solid #1a5f8c;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .toggle-btn {
      padding: 8px 18px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      background: white;
      color: #1a5f8c;
      transition: background .15s, color .15s;
    }
    .toggle-btn.active { background: #1a5f8c; color: white; }
    .toggle-btn:first-child { border-right: 1px solid #1a5f8c; }

    /* ── Row cards ── */
    .row-cards { display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px; }

    .row-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      border-left: 5px solid #1a5f8c;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .card-title { font-weight: 800; font-size: 15px; color: #0d2b50; }

    .btn-del {
      background: #e53935;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      transition: background .15s;
    }
    .btn-del:hover { background: #b71c1c; }

    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .fg { display: flex; flex-direction: column; gap: 5px; }
    .fg > label { font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: .04em; }

    .fg input, .fg select {
      padding: 8px 10px;
      border: 1.5px solid #ddd;
      border-radius: 7px;
      font-size: 14px;
      font-family: inherit;
      width: 100%;
      transition: border-color .15s;
    }
    .fg input:focus, .fg select:focus { outline: none; border-color: #1a5f8c; }

    .radio-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .radio-row label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #333;
    }
    .radio-row input[type=radio] { accent-color: #1a5f8c; width: 15px; height: 15px; }

    /* ── Add button ── */
    .btn-add {
      display: block;
      width: 100%;
      padding: 12px;
      background: #e8f0f9;
      border: 2px dashed #1a5f8c;
      border-radius: 10px;
      color: #1a5f8c;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      margin-bottom: 20px;
      transition: background .15s;
    }
    .btn-add:hover { background: #c8ddf0; }

    /* ── Table section ── */
    .table-section {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      padding: 20px;
      margin-bottom: 16px;
      overflow-x: auto;
    }
    .table-title {
      font-size: 15px;
      font-weight: 800;
      color: #0d2b50;
      margin-bottom: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      min-width: 820px;
    }

    thead th {
      background: #0d2b50;
      color: white;
      padding: 9px 7px;
      text-align: center;
      white-space: nowrap;
      font-size: 11.5px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    tbody td {
      padding: 8px 7px;
      border-bottom: 1px solid #eee;
      text-align: right;
      white-space: nowrap;
    }
    tbody td.c { text-align: center; }
    tbody td.l { text-align: left; }
    tbody tr:nth-child(even) { background: #f7f9fc; }
    tbody tr:hover { background: #edf3fb; }

    tfoot td {
      padding: 9px 7px;
      white-space: nowrap;
      text-align: right;
      font-weight: 700;
    }
    tfoot td.l { text-align: left; }

    tr.tr-sub td { background: #ecf3fb; border-top: 2px solid #1a5f8c; }
    tr.tr-misc td { background: #fff8e1; }
    tr.tr-grand td {
      background: #0d2b50;
      color: white;
      font-size: 13.5px;
      border-top: 2px solid #1a5f8c;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ── Summary cards ── */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .sum-card {
      background: white;
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,.07);
      text-align: center;
    }
    .sum-card .sc-label { font-size: 11px; color: #666; font-weight: 700; margin-bottom: 5px; }
    .sum-card .sc-val { font-size: 18px; font-weight: 800; color: #0d2b50; }

    .total-banner {
      background: linear-gradient(135deg, #0d2b50, #1a5f8c);
      color: white;
      border-radius: 12px;
      padding: 18px 24px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
    }
    .total-banner .tb-label { font-size: 13px; opacity: .85; margin-bottom: 6px; }
    .total-banner .tb-amt { font-size: 38px; font-weight: 900; letter-spacing: .02em; }

    .profit-banner {
      background: linear-gradient(135deg, #1b5e20, #2e7d32);
      color: white;
      border-radius: 12px;
      padding: 14px 24px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,.18);
    }
    .profit-banner .pb-label { font-size: 12px; opacity: .85; margin-bottom: 4px; }
    .profit-banner .pb-amt { font-size: 28px; font-weight: 900; }

    /* ── Action bar ── */
    .action-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .btn-pdf {
      background: #c62828;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-pdf:hover { background: #b71c1c; }

    /* ── Print ── */
    @media print {
      @page {
        size: A4 landscape;
        margin: 10mm 10mm 6mm 10mm;
      }
      body {
        background: white;
        font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
      }
      .no-print { display: none !important; }
      .app { padding: 0; max-width: 100%; }
      .table-section {
        box-shadow: none;
        padding: 0;
        border-radius: 0;
        overflow: visible;
      }
      .table-title { margin-bottom: 8px; }
      table { min-width: auto; font-size: 11px; }
      thead th { padding: 7px 5px; font-size: 10.5px; }
      tbody td, tfoot td { padding: 6px 5px; }
      tr.tr-grand td { font-size: 12px; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback } = React;

/* ═══════════════════════════════════════
   単価マスター
═══════════════════════════════════════ */
const GLASS_PRICES = {
  'FL2':  1560, 'FL3':  1840, 'FL5':  1710, 'FL6':  2130,
  'FL8':  3500, 'FL10': 4800,
  'F6':   4560, 'Fw':   5100, 'pw':   8100,
  'Yカガミ3': 3530, 'Yカガミ5': 4940, 'Yカガミ6': 6000,
  '3+3透明':  7100, '4+4透明':  8900, '5+5透明': 10600,
  '3+3乳半': 10600, '4+4乳半': 12300,
  'ラミブロック3+3透明': 7800, 'ラミブロック4+4透明': 11300,
  'ラミブロック3+3乳半': 10400, 'ラミブロック4+4乳半': 13000,
  '耐熱5': 45000, '耐熱8': 93000,
};

const CONSTRUCTION_RATES = {
  'FL5': 1100, 'FL6': 1200, 'FL8': 1400, 'FL10': 2000, 'FL12': 3000,
  'F6':  1200, 'Fw':  1300, 'pw':  1300,
};
const DEFAULT_RATE = 1200;

const GLASS_TYPES   = Object.keys(GLASS_PRICES);
const MIRROR_TYPES  = new Set(['Yカガミ3', 'Yカガミ5', 'Yカガミ6']);

/* ─── helpers ─── */
const isMirror = (t) => MIRROR_TYPES.has(t);
const rate     = (t) => CONSTRUCTION_RATES[t] ?? DEFAULT_RATE;
const fmt      = (n) => Math.round(n).toLocaleString('ja-JP');
const fmtArea  = (n) => n.toFixed(3);

/* ─── row calculation ─── */
function calcRow(row) {
  const w  = parseFloat(row.width)  || 0;
  const h  = parseFloat(row.height) || 0;
  const q  = parseInt(row.qty)      || 0;
  const up = GLASS_PRICES[row.glassType] || 0;

  const area         = w * h / 1_000_000;
  const materialCost = Math.round(up * area * q * 1.10);
  const glassPrice   = Math.round(materialCost * 2.0);

  // 施工工賃 (修理案件のため常に ×2)
  let constructionCost = 0;
  if (isMirror(row.glassType)) {
    constructionCost = 5000;
  } else {
    const r = rate(row.glassType);
    let c = area * r * q * 2;           // 修理 ×2
    if (row.withRemoval) c += area * r * q; // 取り外し込み
    constructionCost = Math.round(c);
  }

  // コーキング
  let caulkingCost = 0, caulkingRemovalCost = 0;
  if (row.fixMethod === 'caulking') {
    const meters     = ((w + h) / 1000) * 4 * q;
    const cRate      = row.withFireCaulking ? 700 : 300;
    caulkingCost         = Math.round(meters * cRate);
    caulkingRemovalCost  = Math.round(meters * 300);
  }

  const disposalCost = q * 1000;

  return { area, materialCost, glassPrice, constructionCost, caulkingCost, caulkingRemovalCost, disposalCost };
}

/* ─── customer multipliers ─── */
const MULTS = { glassPrice: 1.25, constructionCost: 1.75, caulkingCost: 1.48, caulkingRemovalCost: 1.48, disposalCost: 1.00 };

function toCustomer(c) {
  return {
    ...c,
    glassPrice:          Math.round(c.glassPrice          * MULTS.glassPrice),
    constructionCost:    Math.round(c.constructionCost    * MULTS.constructionCost),
    caulkingCost:        Math.round(c.caulkingCost        * MULTS.caulkingCost),
    caulkingRemovalCost: Math.round(c.caulkingRemovalCost * MULTS.caulkingRemovalCost),
    disposalCost:        Math.round(c.disposalCost        * MULTS.disposalCost),
  };
}

/* ─── row id counter ─── */
let _id = 1;
const newRow = () => ({
  id: _id++,
  width: '', height: '', qty: '1',
  glassType: 'FL5',
  fixMethod: 'caulking',
  withRemoval: false,
  withFireCaulking: false,
});

/* ═══════════════════════════════════════
   RowCard コンポーネント
═══════════════════════════════════════ */
function RowCard({ row, index, onChange, onDelete, canDelete }) {
  const upd = (field, val) => onChange(row.id, { ...row, [field]: val });

  return (
    <div className="row-card">
      <div className="card-header">
        <span className="card-title">明細 {index + 1}</span>
        {canDelete && <button className="btn-del" onClick={() => onDelete(row.id)}>削除</button>}
      </div>
      <div className="fields">
        <div className="fg">
          <label>幅 (mm)</label>
          <input type="number" value={row.width} min="0"
            placeholder="例: 600"
            onChange={e => upd('width', e.target.value)} />
        </div>
        <div className="fg">
          <label>高さ (mm)</label>
          <input type="number" value={row.height} min="0"
            placeholder="例: 900"
            onChange={e => upd('height', e.target.value)} />
        </div>
        <div className="fg">
          <label>枚数</label>
          <input type="number" value={row.qty} min="1"
            onChange={e => upd('qty', e.target.value)} />
        </div>
        <div className="fg">
          <label>ガラス種類</label>
          <select value={row.glassType} onChange={e => upd('glassType', e.target.value)}>
            {GLASS_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        </div>
        <div className="fg" style={{minWidth: '200px'}}>
          <label>留め方</label>
          <div className="radio-row">
            <label><input type="radio" checked={row.fixMethod==='caulking'} onChange={()=>upd('fixMethod','caulking')} /> コーキング留め</label>
            <label><input type="radio" checked={row.fixMethod==='bead'}     onChange={()=>upd('fixMethod','bead')}     /> ビード留め</label>
          </div>
        </div>
        <div className="fg">
          <label>取り外し込み</label>
          <div className="radio-row">
            <label><input type="radio" checked={row.withRemoval}  onChange={()=>upd('withRemoval',true)}  /> あり</label>
            <label><input type="radio" checked={!row.withRemoval} onChange={()=>upd('withRemoval',false)} /> なし</label>
          </div>
        </div>
        <div className="fg">
          <label>防火コーキング</label>
          <div className="radio-row">
            <label><input type="radio" checked={row.withFireCaulking}  onChange={()=>upd('withFireCaulking',true)}  /> あり</label>
            <label><input type="radio" checked={!row.withFireCaulking} onChange={()=>upd('withFireCaulking',false)} /> なし</label>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   App
═══════════════════════════════════════ */
function App() {
  const [rows,        setRows]    = useState([newRow()]);
  const [viewMode,    setView]    = useState('internal');
  const [projectName, setProject] = useState('');

  const handleChange = useCallback((id, updated) => {
    setRows(prev => prev.map(r => r.id === id ? updated : r));
  }, []);
  const handleAdd    = () => setRows(prev => [...prev, newRow()]);
  const handleDelete = useCallback((id) => {
    setRows(prev => prev.filter(r => r.id !== id));
  }, []);

  const isInternal = viewMode === 'internal';

  /* ─── calculations ─── */
  const totalQty   = rows.reduce((s, r) => s + (parseInt(r.qty) || 0), 0);
  const miscExp    = totalQty >= 4 ? 15000 : (totalQty >= 1 ? 7500 : 0);

  const internalCalcs = rows.map(calcRow);
  const displayCalcs  = isInternal ? internalCalcs : internalCalcs.map(toCustomer);

  const sum = (field) => displayCalcs.reduce((s, c) => s + c[field], 0);

  const totGlass        = sum('glassPrice');
  const totConst        = sum('constructionCost');
  const totCaulk        = sum('caulkingCost');
  const totCaulkRem     = sum('caulkingRemovalCost');
  const totDisposal     = sum('disposalCost');
  const totArea         = internalCalcs.reduce((s, c) => s + c.area, 0);
  const totMaterial     = internalCalcs.reduce((s, c) => s + c.materialCost, 0);
  const subtotal        = totGlass + totConst + totCaulk + totCaulkRem + totDisposal;
  const grandTotal      = subtotal + miscExp;
  const profit          = internalCalcs.reduce((s, c) => s + c.glassPrice + c.constructionCost + c.caulkingCost + c.caulkingRemovalCost + c.disposalCost, 0) + miscExp - totMaterial;

  /* ─── column span helpers ─── */
  // internal: 12 cols, customer: 11 cols
  // first 4 = No./寸法/種類/枚数, then 面積, [材料原価 internal], glass, const, caulk, caulkRem, disposal, 合計
  const footerSpan = isInternal ? 11 : 10;

  return (
    <div className="app">
      {/* ── Header ── */}
      <div className="header no-print">
        <div>
          <h1>ユーエス硝子　ガラス積算ツール</h1>
          <p className="sub">ガラス修理・交換用</p>
        </div>
      </div>

      {/* ── Top bar ── */}
      <div className="topbar no-print">
        <label>案件名</label>
        <input className="project-input" type="text" value={projectName}
          placeholder="案件名・現場名を入力（任意）"
          onChange={e => setProject(e.target.value)} />
        <label style={{marginLeft:'8px'}}>表示モード</label>
        <div className="toggle-wrap">
          <button className={`toggle-btn ${isInternal  ? 'active' : ''}`} onClick={() => setView('internal')}>社内用</button>
          <button className={`toggle-btn ${!isInternal ? 'active' : ''}`} onClick={() => setView('customer')}>元請け提出用</button>
        </div>
      </div>

      {/* ── Row cards ── */}
      <div className="row-cards no-print">
        {rows.map((row, i) => (
          <RowCard
            key={row.id} row={row} index={i}
            onChange={handleChange} onDelete={handleDelete}
            canDelete={rows.length > 1}
          />
        ))}
      </div>
      <button className="btn-add no-print" onClick={handleAdd}>＋ 明細を追加</button>

      {/* ── Summary table ── */}
      <div className="table-section">
        <div className="table-title no-print">
          {isInternal ? '【社内用】 積算明細' : '【元請け提出用】 見積明細'}
          {projectName && <span style={{marginLeft:'12px', fontWeight:'normal', color:'#666'}}>— {projectName}</span>}
        </div>
        {/* print header */}
        <div style={{display:'none'}} className="print-only">
          <div style={{fontSize:'14px', fontWeight:'800', marginBottom:'6px'}}>
            ユーエス硝子　{isInternal ? '社内用 積算明細' : '元請け提出用 見積明細'}
            {projectName && `　／　${projectName}`}
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>No.</th>
              <th>寸法（幅×高）</th>
              <th>ガラス種類</th>
              <th>枚数</th>
              <th>面積(m²)</th>
              {isInternal && <th>材料原価</th>}
              <th>ガラス売価</th>
              <th>施工工賃</th>
              <th>コーキング費</th>
              <th>コーキング<br />剥がし代</th>
              <th>廃棄代</th>
              <th>行合計</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((row, i) => {
              const c   = displayCalcs[i];
              const ic  = internalCalcs[i];
              const rowTotal = c.glassPrice + c.constructionCost + c.caulkingCost + c.caulkingRemovalCost + c.disposalCost;
              return (
                <tr key={row.id}>
                  <td className="c">{i + 1}</td>
                  <td className="l">
                    {row.width && row.height
                      ? `${Number(row.width).toLocaleString()} × ${Number(row.height).toLocaleString()}`
                      : '—'}
                  </td>
                  <td className="l">{row.glassType}</td>
                  <td className="c">{row.qty || '—'}</td>
                  <td>{fmtArea(ic.area)}</td>
                  {isInternal && <td>{fmt(ic.materialCost)}</td>}
                  <td>{fmt(c.glassPrice)}</td>
                  <td>{fmt(c.constructionCost)}</td>
                  <td>{fmt(c.caulkingCost)}</td>
                  <td>{fmt(c.caulkingRemovalCost)}</td>
                  <td>{fmt(c.disposalCost)}</td>
                  <td><strong>{fmt(rowTotal)}</strong></td>
                </tr>
              );
            })}
          </tbody>
          <tfoot>
            {/* 小計 */}
            <tr className="tr-sub">
              <td colSpan={4} className="l">小計</td>
              <td>{fmtArea(totArea)}</td>
              {isInternal && <td>{fmt(totMaterial)}</td>}
              <td>{fmt(totGlass)}</td>
              <td>{fmt(totConst)}</td>
              <td>{fmt(totCaulk)}</td>
              <td>{fmt(totCaulkRem)}</td>
              <td>{fmt(totDisposal)}</td>
              <td><strong>{fmt(subtotal)}</strong></td>
            </tr>
            {/* 諸経費 */}
            <tr className="tr-misc">
              <td colSpan={footerSpan} className="l">
                諸経費（総枚数 {totalQty} 枚 ／ {totalQty >= 4 ? '4枚以上' : '1〜3枚'}）
              </td>
              <td><strong>{fmt(miscExp)}</strong></td>
            </tr>
            {/* 合計 */}
            <tr className="tr-grand">
              <td colSpan={footerSpan} className="l">
                {isInternal ? '合計金額' : <strong>見積金額合計</strong>}
              </td>
              <td><strong>{fmt(grandTotal)}</strong></td>
            </tr>
          </tfoot>
        </table>
      </div>

      {/* ── Summary banners (screen only) ── */}
      {isInternal && (
        <div className="summary-row no-print">
          <div className="sum-card"><div className="sc-label">ガラス売価 計</div><div className="sc-val">¥{fmt(totGlass)}</div></div>
          <div className="sum-card"><div className="sc-label">施工工賃 計</div><div className="sc-val">¥{fmt(totConst)}</div></div>
          <div className="sum-card"><div className="sc-label">コーキング費 計</div><div className="sc-val">¥{fmt(totCaulk)}</div></div>
          <div className="sum-card"><div className="sc-label">コーキング剥がし代 計</div><div className="sc-val">¥{fmt(totCaulkRem)}</div></div>
          <div className="sum-card"><div className="sc-label">廃棄代 計</div><div className="sc-val">¥{fmt(totDisposal)}</div></div>
          <div className="sum-card"><div className="sc-label">諸経費</div><div className="sc-val">¥{fmt(miscExp)}</div></div>
          <div className="sum-card"><div className="sc-label">材料原価 計</div><div className="sc-val">¥{fmt(totMaterial)}</div></div>
        </div>
      )}

      <div className="total-banner no-print">
        <div className="tb-label">{isInternal ? '合計金額' : '見積金額合計'}</div>
        <div className="tb-amt">¥ {fmt(grandTotal)}</div>
      </div>

      {isInternal && (
        <div className="profit-banner no-print">
          <div className="pb-label">粗利</div>
          <div className="pb-amt">¥ {fmt(profit)}</div>
        </div>
      )}

      {/* ── Actions ── */}
      <div className="action-bar no-print">
        <button className="btn-pdf" onClick={() => window.print()}>
          PDF出力（A4 横）
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
