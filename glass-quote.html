<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーエス硝子 ガラス積算ツール</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo','Yu Gothic',sans-serif;background:#eef1f5;color:#222;font-size:14px}
.app{max-width:1400px;margin:0 auto;padding:16px}

/* ── Header ── */
.hdr{background:linear-gradient(135deg,#0d2b50,#1a5f8c);color:#fff;padding:18px 24px;border-radius:14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.hdr h1{font-size:20px;font-weight:800}
.hdr p{font-size:12px;opacity:.75;margin-top:4px}

/* ── Top bar ── */
.topbar{display:flex;gap:10px;align-items:center;background:#fff;border-radius:10px;padding:12px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);flex-wrap:wrap}
.tblabel{font-weight:700;font-size:13px;white-space:nowrap}
#pname{flex:1;min-width:180px;padding:8px 12px;border:1.5px solid #ccc;border-radius:7px;font-family:inherit;font-size:14px}
#pname:focus{outline:none;border-color:#1a5f8c}
.toggle-wrap{display:flex;border:2px solid #1a5f8c;border-radius:8px;overflow:hidden}
.tbtn{padding:8px 18px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;background:#fff;color:#1a5f8c}
.tbtn:first-child{border-right:1px solid #1a5f8c}
.tbtn.on{background:#1a5f8c;color:#fff}

/* ── Row cards ── */
.row-cards{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.row-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.07);border-left:5px solid #1a5f8c}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-ttl{font-weight:800;font-size:15px;color:#0d2b50}
.btn-del{background:#e53935;color:#fff;border:none;padding:6px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fglabel{font-size:11px;font-weight:700;color:#555;letter-spacing:.04em}
.fg input[type=number],.fg select{padding:8px 10px;border:1.5px solid #ddd;border-radius:7px;font-size:14px;font-family:inherit;width:100%}
.fg input[type=number]:focus,.fg select:focus{outline:none;border-color:#1a5f8c}
.rrow{display:flex;gap:10px;flex-wrap:wrap;padding-top:3px}
.rrow label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:13px;color:#333}
.rrow input[type=radio]{width:15px;height:15px;accent-color:#1a5f8c}

/* ── Add button ── */
.btn-add{display:block;width:100%;padding:12px;background:#e8f0f9;border:2px dashed #1a5f8c;border-radius:10px;color:#1a5f8c;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;text-align:center;margin-bottom:20px}
.btn-add:hover{background:#d0e5f7}

/* ── Table section ── */
.tbl-section{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);padding:20px;margin-bottom:14px;overflow-x:auto}
.tbl-title{font-size:15px;font-weight:800;color:#0d2b50;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:820px}
thead th{background:#0d2b50;color:#fff;padding:9px 7px;text-align:center;white-space:nowrap;font-size:11.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
tbody td{padding:8px 7px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}
tbody td.c{text-align:center}
tbody td.l{text-align:left}
tbody tr:nth-child(even){background:#f7f9fc}
tfoot td{padding:9px 7px;text-align:right;font-weight:700;white-space:nowrap}
tfoot td.l{text-align:left}
.tr-sub td{background:#ecf3fb;border-top:2px solid #1a5f8c}
.tr-misc td{background:#fff8e1}
.tr-grand td{background:#0d2b50;color:#fff;font-size:13.5px;border-top:2px solid #1a5f8c;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ── Banners ── */
.total-banner{background:linear-gradient(135deg,#0d2b50,#1a5f8c);color:#fff;border-radius:12px;padding:18px 24px;text-align:center;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.total-banner .lbl{font-size:13px;opacity:.85;margin-bottom:6px}
.total-banner .amt{font-size:38px;font-weight:900}
.profit-banner{background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#fff;border-radius:12px;padding:14px 24px;text-align:center;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.profit-banner .lbl{font-size:12px;opacity:.85;margin-bottom:4px}
.profit-banner .amt{font-size:28px;font-weight:900}

/* ── PDF button ── */
.action-bar{margin-bottom:24px}
.btn-pdf{background:#c62828;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
.btn-pdf:hover{background:#b71c1c}

/* ── Print ── */
@media print{
  @page{size:A4 landscape;margin:10mm 10mm 6mm 10mm}
  body{background:#fff;font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo',sans-serif}
  .no-print{display:none!important}
  .app{padding:0;max-width:100%}
  .tbl-section{box-shadow:none;padding:0;border-radius:0;overflow:visible}
  table{min-width:auto;font-size:11px}
  thead th{padding:7px 5px;font-size:10.5px}
  tbody td,tfoot td{padding:6px 5px}
  .tr-grand td{font-size:12px}
}
</style>
</head>
<body>
<div class="app">

  <div class="hdr no-print">
    <h1>ユーエス硝子　ガラス積算ツール</h1>
    <p>ガラス修理・交換用</p>
  </div>

  <div class="topbar no-print">
    <span class="tblabel">案件名</span>
    <input type="text" id="pname" placeholder="案件名・現場名（任意）" oninput="calc()">
    <span class="tblabel">表示モード</span>
    <div class="toggle-wrap">
      <button id="btn-int" class="tbtn on" onclick="setView('internal')">社内用</button>
      <button id="btn-cus" class="tbtn"     onclick="setView('customer')">元請け提出用</button>
    </div>
  </div>

  <div id="row-cards" class="row-cards no-print"></div>
  <button class="btn-add no-print" onclick="addRow()">＋ 明細を追加</button>

  <div class="tbl-section">
    <div id="tbl-title" class="tbl-title no-print">【社内用】 積算明細</div>
    <div id="tbl-body"></div>
  </div>

  <div class="total-banner no-print">
    <div class="lbl" id="total-lbl">合計金額</div>
    <div class="amt" id="total-amt">¥ 0</div>
  </div>

  <div id="profit-sec" class="profit-banner no-print">
    <div class="lbl">粗利</div>
    <div class="amt" id="profit-amt">¥ 0</div>
  </div>

  <div class="action-bar no-print">
    <button class="btn-pdf" onclick="window.print()">PDF出力（A4 横）</button>
  </div>

</div>
<script>
'use strict';

/* ══ 単価マスター ══ */
var GP = {
  'FL2':1560,'FL3':1840,'FL5':1710,'FL6':2130,'FL8':3500,'FL10':4800,
  'F6':4560,'Fw':5100,'pw':8100,
  'Yカガミ3':3530,'Yカガミ5':4940,'Yカガミ6':6000,
  '3+3透明':7100,'4+4透明':8900,'5+5透明':10600,
  '3+3乳半':10600,'4+4乳半':12300,
  'ラミブロック3+3透明':7800,'ラミブロック4+4透明':11300,
  'ラミブロック3+3乳半':10400,'ラミブロック4+4乳半':13000,
  '耐熱5':45000,'耐熱8':93000
};
var CR = {
  'FL5':1100,'FL6':1200,'FL8':1400,'FL10':2000,'FL12':3000,
  'F6':1200,'Fw':1300,'pw':1300
};
var MIRRORS = {'Yカガミ3':1,'Yカガミ5':1,'Yカガミ6':1};
var MULTS = {g:1.25,c:1.75,k:1.48,kr:1.48,d:1.00};

var viewMode = 'internal';
var rid = 0;

function fmt(n){ return Math.round(n).toLocaleString('ja-JP'); }
function fmtA(n){ return n.toFixed(3); }
function getRate(t){ return CR[t] !== undefined ? CR[t] : 1200; }

/* ── ガラス種類 <option> 文字列 ── */
var GOPTS = (function(){
  var s = '';
  var keys = Object.keys(GP);
  for(var i=0;i<keys.length;i++){
    s += '<option value="'+keys[i]+'"'+(keys[i]==='FL5'?' selected':'')+'>'+keys[i]+'</option>';
  }
  return s;
})();

/* ── 行計算 ── */
function calcRow(d){
  var w  = parseFloat(d.w)  || 0;
  var h  = parseFloat(d.h)  || 0;
  var q  = parseInt(d.q)    || 0;
  var up = GP[d.g]          || 0;
  var area = w * h / 1000000;
  var mat  = Math.round(up * area * q * 1.10);
  var gp   = Math.round(mat * 2.0);

  var cc = 0;
  if(MIRRORS[d.g]){
    cc = 5000;
  } else {
    var r = getRate(d.g);
    var base = area * r * q * 2;       /* 修理案件 常に×2 */
    if(d.rem) base += area * r * q;    /* 取り外し込み */
    cc = Math.round(base);
  }

  var kc=0, kr=0;
  if(d.fix === 'caulking'){
    var m = ((w+h)/1000) * 4 * q;
    kc = Math.round(m * (d.fire ? 700 : 300));
    kr = Math.round(m * 300);
  }

  return {area:area, mat:mat, gp:gp, cc:cc, kc:kc, kr:kr, dc:q*1000};
}

/* ── 行データ取得 ── */
function getRowData(el){
  function radio(pre){
    var el2 = el.querySelector('input[name="'+pre+'"]:checked');
    return el2 ? el2.value : '';
  }
  return {
    w:   el.querySelector('.iw').value,
    h:   el.querySelector('.ih').value,
    q:   el.querySelector('.iq').value,
    g:   el.querySelector('.ig').value,
    fix: radio('fix'+el.dataset.rid),
    rem: radio('rem'+el.dataset.rid) === '1',
    fire:radio('fir'+el.dataset.rid) === '1'
  };
}

/* ── メイン計算＋テーブル描画 ── */
function calc(){
  var cards = document.querySelectorAll('.row-card');
  var datas=[], calcs=[];
  for(var i=0;i<cards.length;i++){
    var d = getRowData(cards[i]);
    datas.push(d);
    calcs.push(calcRow(d));
  }

  var tq=0;
  for(var i=0;i<datas.length;i++) tq += parseInt(datas[i].q)||0;
  var misc = tq>=4 ? 15000 : (tq>=1 ? 7500 : 0);

  var isInt = viewMode === 'internal';

  /* 表示用計算値（元請けは倍率適用） */
  var disp=[];
  for(var i=0;i<calcs.length;i++){
    var c=calcs[i];
    if(isInt){
      disp.push(c);
    } else {
      disp.push({
        area:c.area, mat:c.mat,
        gp:  Math.round(c.gp  * MULTS.g),
        cc:  Math.round(c.cc  * MULTS.c),
        kc:  Math.round(c.kc  * MULTS.k),
        kr:  Math.round(c.kr  * MULTS.kr),
        dc:  Math.round(c.dc  * MULTS.d)
      });
    }
  }

  /* 合計 */
  var tG=0,tC=0,tK=0,tKR=0,tD=0,tA=0,tM=0;
  for(var i=0;i<disp.length;i++){
    tG+=disp[i].gp; tC+=disp[i].cc; tK+=disp[i].kc;
    tKR+=disp[i].kr; tD+=disp[i].dc;
    tA+=calcs[i].area; tM+=calcs[i].mat;
  }
  var sub   = tG+tC+tK+tKR+tD;
  var grand = sub+misc;

  /* 粗利（社内値ベース） */
  var intSub=0;
  for(var i=0;i<calcs.length;i++)
    intSub += calcs[i].gp+calcs[i].cc+calcs[i].kc+calcs[i].kr+calcs[i].dc;
  var profit = intSub + misc - tM;

  var fspan = isInt ? 11 : 10;

  /* ── テーブルHTML組立 ── */
  var h='<table><thead><tr>';
  h+='<th>No.</th><th>寸法（幅×高）</th><th>ガラス種類</th><th>枚数</th><th>面積(m²)</th>';
  if(isInt) h+='<th>材料原価</th>';
  h+='<th>ガラス売価</th><th>施工工賃</th><th>コーキング費</th><th>コーキング<br>剥がし代</th><th>廃棄代</th><th>行合計</th>';
  h+='</tr></thead><tbody>';

  for(var i=0;i<datas.length;i++){
    var d=datas[i], c=disp[i], ic=calcs[i];
    var rt = c.gp+c.cc+c.kc+c.kr+c.dc;
    var dim = (d.w&&d.h) ? d.w+' × '+d.h : '—';
    h+='<tr>';
    h+='<td class="c">'+(i+1)+'</td>';
    h+='<td class="l">'+dim+'</td>';
    h+='<td class="l">'+d.g+'</td>';
    h+='<td class="c">'+(d.q||'—')+'</td>';
    h+='<td>'+fmtA(ic.area)+'</td>';
    if(isInt) h+='<td>'+fmt(ic.mat)+'</td>';
    h+='<td>'+fmt(c.gp)+'</td>';
    h+='<td>'+fmt(c.cc)+'</td>';
    h+='<td>'+fmt(c.kc)+'</td>';
    h+='<td>'+fmt(c.kr)+'</td>';
    h+='<td>'+fmt(c.dc)+'</td>';
    h+='<td><strong>'+fmt(rt)+'</strong></td>';
    h+='</tr>';
  }
  h+='</tbody><tfoot>';

  /* 小計 */
  h+='<tr class="tr-sub"><td colspan="4" class="l">小計</td>';
  h+='<td>'+fmtA(tA)+'</td>';
  if(isInt) h+='<td>'+fmt(tM)+'</td>';
  h+='<td>'+fmt(tG)+'</td><td>'+fmt(tC)+'</td><td>'+fmt(tK)+'</td><td>'+fmt(tKR)+'</td><td>'+fmt(tD)+'</td>';
  h+='<td><strong>'+fmt(sub)+'</strong></td></tr>';

  /* 諸経費 */
  var miscLbl='諸経費（総枚数 '+tq+' 枚 ／ '+(tq>=4?'4枚以上':'1〜3枚')+'）';
  h+='<tr class="tr-misc"><td colspan="'+fspan+'" class="l">'+miscLbl+'</td>';
  h+='<td><strong>'+fmt(misc)+'</strong></td></tr>';

  /* 合計 */
  var gLbl = isInt ? '合計金額' : '<strong>見積金額合計</strong>';
  h+='<tr class="tr-grand"><td colspan="'+fspan+'" class="l">'+gLbl+'</td>';
  h+='<td><strong>'+fmt(grand)+'</strong></td></tr>';

  h+='</tfoot></table>';
  document.getElementById('tbl-body').innerHTML = h;

  /* バナー更新 */
  document.getElementById('total-lbl').textContent = isInt ? '合計金額' : '見積金額合計';
  document.getElementById('total-amt').textContent = '¥ '+fmt(grand);

  var ps = document.getElementById('profit-sec');
  ps.style.display = isInt ? 'block' : 'none';
  if(isInt) document.getElementById('profit-amt').textContent = '¥ '+fmt(profit);

  /* タイトル */
  var pn = document.getElementById('pname').value;
  var ttl = isInt ? '【社内用】 積算明細' : '【元請け提出用】 見積明細';
  if(pn) ttl += ' — '+pn;
  document.getElementById('tbl-title').textContent = ttl;
}

/* ── 表示モード切替 ── */
function setView(mode){
  viewMode = mode;
  document.getElementById('btn-int').className = 'tbtn'+(mode==='internal'?' on':'');
  document.getElementById('btn-cus').className = 'tbtn'+(mode==='customer'?' on':'');
  calc();
}

/* ── 行番号更新＆削除ボタン表示制御 ── */
function renumber(){
  var cards = document.querySelectorAll('.row-card');
  for(var i=0;i<cards.length;i++){
    var n = cards[i].querySelector('.rnum');
    if(n) n.textContent = i+1;
    var b = cards[i].querySelector('.btn-del');
    if(b) b.style.display = cards.length>1 ? '' : 'none';
  }
}

/* ── 行追加 ── */
function addRow(){
  rid++;
  var id = rid;
  var div = document.createElement('div');
  div.className = 'row-card';
  div.id = 'rc'+id;
  div.dataset.rid = id;
  div.innerHTML =
    '<div class="card-hdr">'
    +'<span class="card-ttl">明細 <span class="rnum"></span></span>'
    +'<button class="btn-del" onclick="delRow(\'rc'+id+'\')">削除</button>'
    +'</div>'
    +'<div class="fields">'

    +'<div class="fg">'
    +'<span class="fglabel">幅 (mm)</span>'
    +'<input type="number" class="iw" placeholder="例: 600" min="0" oninput="calc()">'
    +'</div>'

    +'<div class="fg">'
    +'<span class="fglabel">高さ (mm)</span>'
    +'<input type="number" class="ih" placeholder="例: 900" min="0" oninput="calc()">'
    +'</div>'

    +'<div class="fg">'
    +'<span class="fglabel">枚数</span>'
    +'<input type="number" class="iq" value="1" min="1" oninput="calc()">'
    +'</div>'

    +'<div class="fg">'
    +'<span class="fglabel">ガラス種類</span>'
    +'<select class="ig" onchange="calc()">'+GOPTS+'</select>'
    +'</div>'

    +'<div class="fg">'
    +'<span class="fglabel">留め方</span>'
    +'<div class="rrow">'
    +'<label><input type="radio" name="fix'+id+'" value="caulking" checked onchange="calc()"> コーキング留め</label>'
    +'<label><input type="radio" name="fix'+id+'" value="bead" onchange="calc()"> ビード留め</label>'
    +'</div>'
    +'</div>'

    +'<div class="fg">'
    +'<span class="fglabel">取り外し込み</span>'
    +'<div class="rrow">'
    +'<label><input type="radio" name="rem'+id+'" value="0" checked onchange="calc()"> なし</label>'
    +'<label><input type="radio" name="rem'+id+'" value="1" onchange="calc()"> あり</label>'
    +'</div>'
    +'</div>'

    +'<div class="fg">'
    +'<span class="fglabel">防火コーキング</span>'
    +'<div class="rrow">'
    +'<label><input type="radio" name="fir'+id+'" value="0" checked onchange="calc()"> なし</label>'
    +'<label><input type="radio" name="fir'+id+'" value="1" onchange="calc()"> あり</label>'
    +'</div>'
    +'</div>'

    +'</div>';

  document.getElementById('row-cards').appendChild(div);
  renumber();
  calc();
}

/* ── 行削除 ── */
function delRow(id){
  var el = document.getElementById(id);
  if(el) el.parentNode.removeChild(el);
  renumber();
  calc();
}

/* ── 起動 ── */
addRow();
</script>
</body>
</html>
